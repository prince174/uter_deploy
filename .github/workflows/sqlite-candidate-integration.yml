name: Check experimental SQLite image candidates
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Obtain independently pinned signed installation inputs
        run: |
          mkdir -p work
          python scripts/fetch_release.py --release deploy-2026.10.29-signed-4 --version 0.1.6 --fingerprint 65be6fd9613fa7e879735fe5b453bfcb8c0e38911cd7429c9aac9c9afba676a2 --output "$PWD/work/release"
          mkdir -p work/images/protected-guardrail/evidence/policies work/images/protected-guardrail/evidence/profiles
          cp work/release/inputs/policy.toml work/images/protected-guardrail/evidence/policies/default.toml
          cp work/release/inputs/model_profiles.toml work/images/protected-guardrail/evidence/profiles/model_profiles.toml
      - name: Build both candidates from pinned published images
        run: |
          docker build --provenance=false --build-arg PROTECTED_IMAGE=ghcr.io/prince174/uter-agent@sha256:a6f03a1f102fcc941b1aad0a0ada9f664b2451c0e0acb06a46c5aaaedee86da1 --build-arg SERVICE=agent -f packaging/Dockerfile.sqlite-candidate -t uter-agent-protected packaging
          docker build --provenance=false --build-arg PROTECTED_IMAGE=ghcr.io/prince174/uter-guardrail@sha256:2b157a9d01f454cd7fdaf67345b5d872cd26e8f5785132cce933ee22c9fa296e --build-arg SERVICE=guardrail -f packaging/Dockerfile.sqlite-candidate -t uter-guardrail-protected packaging
          mkdir -p work/security
          docker image inspect uter-agent-protected --format '{{.Id}}' > work/security/agent-image-id.txt
          docker image inspect uter-guardrail-protected --format '{{.Id}}' > work/security/guardrail-image-id.txt
      - name: Verify the actual loaded SQLite library
        run: |
          for service in agent guardrail; do
            expected=$(cat "work/security/$service-image-id.txt")
            test "$(docker image inspect "uter-$service-protected" --format '{{.Id}}')" = "$expected"
            docker run --rm --network none -i --entrypoint python "uter-$service-protected" - > "work/security/$service-sqlite.json" <<'PY'
          import hashlib, json, sqlite3
          db = sqlite3.connect(':memory:')
          db.execute('create virtual table docs using fts5(content)')
          db.execute('insert into docs values (?)', ('security update',))
          assert db.execute('select count(*) from docs where docs match ?', ('security',)).fetchone()[0] == 1
          assert sqlite3.sqlite_version == '3.54.1'
          paths = {line.split()[-1] for line in open('/proc/self/maps') if 'libsqlite3.so' in line}
          assert len(paths) == 1
          digest = hashlib.sha256(open(paths.pop(), 'rb').read()).hexdigest()
          assert digest == '225ceb839db2c1dd484cfcaa5ef9fbdd429eb1d5f1e0c39fbd50150bca5fc7bc'
          print(json.dumps({'sqlite_version': sqlite3.sqlite_version, 'library_sha256': digest, 'fts5': 'pass'}))
          PY
            test "$(docker image inspect "uter-$service-protected" --format '{{.Id}}')" = "$expected"
          done
      - name: Exercise both candidates in disposable Compose
        run: python scripts/image_integration.py > /dev/null 2>&1 || { echo 'Candidate Compose integration failed'; exit 1; }
      - name: Scan Agent candidate
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          version: v0.74.0
          scan-type: image
          image-ref: uter-agent-protected
          scanners: vuln,secret
          format: json
          output: work/security/agent.json
          exit-code: '0'
          timeout: 10m
      - name: Scan Guardrail candidate
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          version: v0.74.0
          scan-type: image
          image-ref: uter-guardrail-protected
          scanners: vuln,secret
          format: json
          output: work/security/guardrail.json
          exit-code: '0'
          timeout: 10m
      - name: Record evidence-only SQLite assessment
        run: |
          for service in agent guardrail; do
            test "$(docker image inspect "uter-$service-protected" --format '{{.Id}}')" = "$(cat "work/security/$service-image-id.txt")"
            python scripts/sqlite_candidate_assessment.py "work/security/$service.json" "work/security/$service-image-id.txt" "work/security/$service-sqlite.json" "work/security/$service-assessment.json"
          done
      - name: Enforce existing security gate without exclusions
        id: strict_gate
        continue-on-error: true
        run: |
          python scripts/security_gate.py work/security/agent.json work/security/agent-summary.json
          python scripts/security_gate.py work/security/guardrail.json work/security/guardrail-summary.json
      - name: Enforce explicitly scoped SQLite VEX gate
        run: |
          for service in agent guardrail; do
            test "$(docker image inspect "uter-$service-protected" --format '{{.Id}}')" = "$(cat "work/security/$service-image-id.txt")"
            python scripts/sqlite_vex_gate.py "work/security/$service.json" "work/security/$service-image-id.txt" "work/security/$service-sqlite.json" "work/security/$service-vex-summary.json"
          done
      - name: Check both image archives for exposed source
        run: |
          mkdir -p work/image-audit
          for service in agent guardrail; do
            test "$(docker image inspect "uter-$service-protected" --format '{{.Id}}')" = "$(cat "work/security/$service-image-id.txt")"
            docker save "uter-$service-protected" -o "work/image-audit/$service.tar"
            python scripts/scan_image_archive.py "work/image-audit/$service.tar" --report "work/security/$service-source-audit.json"
            rm "work/image-audit/$service.tar"
          done
      - name: Publish exactly the checked candidates
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          RAW_GATE_OUTCOME: ${{ steps.strict_gate.outcome }}
        run: python scripts/publish_sqlite_candidates.py
      - name: Prepare public-safe evidence
        if: always()
        run: python scripts/export_sqlite_ci_evidence.py work
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: sqlite-candidate-integration-evidence
          path: work/public-evidence/
          retention-days: 14
          if-no-files-found: warn
