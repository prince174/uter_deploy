# Downloads the pinned CPU vLLM image (~1.72 GiB), model (~0.269 GiB),
# LiteLLM, public Uter images and a kind node. Hosted runners only.
name: Verify complete public user journey with LiteLLM and vLLM
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Public signed release with the installation wizard
        type: string
        required: true
      version:
        description: Expected version in the signed manifest
        type: string
        required: true
        default: '0.1.6'
      llm_max_tokens_scenario:
        description: Explicit Uter max-tokens configuration for this CPU test
        type: choice
        required: true
        default: '64'
        options:
          - '64'
permissions:
  contents: read
jobs:
  wizard-real-llm:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        backend: [compose, kubernetes]
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_VERSION: ${{ inputs.version }}
      LLM_MAX_TOKENS_SCENARIO: ${{ inputs.llm_max_tokens_scenario }}
    steps:
      - name: Fetch the public deployment repository anonymously
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          [[ "$GITHUB_REPOSITORY" == 'prince174/uter_deploy' ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          test ! -e "$GITHUB_WORKSPACE/.git"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C "$GITHUB_WORKSPACE" -c credential.helper= fetch --no-recurse-submodules --tags origin '+refs/heads/*:refs/remotes/origin/*'
          git -C "$GITHUB_WORKSPACE" checkout --detach "$GITHUB_SHA"
      - name: Download signed public release assets
        shell: bash
        run: |
          mkdir -p work/pair/new
          for file in signed-bundle.tar.gz publisher-public.pem installation-inputs.tar.gz installation-inputs.tar.gz.sha256; do
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
              --connect-timeout 20 --max-time 180 --max-filesize 134217728 \
              -o "work/pair/new/$file" "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$file"
          done
      - name: Prepare Python and pinned Helm
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt
          curl -fsSLO https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz
          # Digest recorded from Helm's published checksum; prevents a later
          # download from silently changing, but is not an independent signature.
          echo 'ee88b3c851ae6466a3de507f7be73fe94d54cbf2987cbaa3d1a3832ea331f2cd  helm-v3.17.3-linux-amd64.tar.gz' | sha256sum -c -
          tar -xzf helm-v3.17.3-linux-amd64.tar.gz
          sudo install linux-amd64/helm /usr/local/bin/helm
      - name: Install pinned kind
        if: matrix.backend == 'kubernetes'
        run: |
          curl -fsSL https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64 -o kind-bin
          echo 'aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  kind-bin' | sha256sum -c -
          sudo install kind-bin /usr/local/bin/kind
      - name: Start isolated LLM services and run the published wizard
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          sudo --preserve-env=GITHUB_ACTIONS,GITHUB_EVENT_NAME,GITHUB_REPOSITORY,GITHUB_WORKSPACE,RUNNER_ENVIRONMENT,RUNNER_OS,BACKEND,RELEASE_TAG,RELEASE_VERSION,LLM_MAX_TOKENS_SCENARIO \
            "$PWD/.venv/bin/python" scripts/full_user_journey_ci.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: full-user-journey-${{ matrix.backend }}-evidence
          path: work/full-user-journey-evidence.json
          retention-days: 30
          if-no-files-found: warn
