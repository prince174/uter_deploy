name: Synthetic session archive worker feasibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Build pinned MIT-licensed librdb and synthetic workers
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/librdb"
          git -C "$RUNNER_TEMP/librdb" remote add origin https://github.com/redis/librdb.git
          git -C "$RUNNER_TEMP/librdb" fetch --depth 1 origin bc5f295c98b40c2c33099d9d72ab30ce9e595dc7
          git -C "$RUNNER_TEMP/librdb" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/librdb" rev-parse HEAD)" = bc5f295c98b40c2c33099d9d72ab30ce9e595dc7
          git -C "$RUNNER_TEMP/librdb" submodule update --init --depth 1
          make -C "$RUNNER_TEMP/librdb" -j2
          cc -std=c99 -Wall -Wextra -Werror -I"$RUNNER_TEMP/librdb/api" scripts/experimental_rdb_probe.c "$RUNNER_TEMP/librdb/lib/librdb.a" -lm -o "$RUNNER_TEMP/rdb-probe"
          cc -std=c99 -Wall -Wextra -Werror -I"$RUNNER_TEMP/librdb/api" scripts/session_archive_worker.c "$RUNNER_TEMP/librdb/lib/librdb.a" -lm -o "$RUNNER_TEMP/rdb-worker"
      - name: Test synthetic expired session and damaged RDB from a published Redis digest
        run: |
          set -euo pipefail
          ulimit -c 0
          python3 -m scripts.session_archive_worker_ci "$RUNNER_TEMP/rdb-probe" "$RUNNER_TEMP/rdb-worker"
