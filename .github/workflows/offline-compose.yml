name: Verify offline Compose installation
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Public signed release supplying image and installation inputs
        required: true
        type: string
        default: deploy-2026.10.28-signed-5
permissions:
  contents: read
jobs:
  offline-compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout candidate tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: driver
          persist-credentials: false
      - name: Checkout public release
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: prince174/uter_deploy
          ref: ${{ inputs.release_tag }}
          path: release
          persist-credentials: false
      - name: Download public signed assets
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          case "$RELEASE_TAG" in *[!a-zA-Z0-9._-]*|'') exit 1;; esac
          mkdir -p work/download
          for file in installation-inputs.tar.gz installation-inputs.tar.gz.sha256 signed-bundle.tar.gz publisher-public.pem; do
            curl --fail --location --silent -o "work/download/$file" "https://github.com/prince174/uter_deploy/releases/download/$RELEASE_TAG/$file"
          done
          echo '65be6fd9613fa7e879735fe5b453bfcb8c0e38911cd7429c9aac9c9afba676a2  work/download/publisher-public.pem' | sha256sum -c -
      - name: Authenticate the public release
        run: |
          python3 -m venv work/venv
          work/venv/bin/pip install --quiet -r release/requirements.txt
          work/venv/bin/python driver/scripts/extract_signed_bundle.py --archive work/download/signed-bundle.tar.gz --key work/download/publisher-public.pem --output work/signed
          work/venv/bin/python -c 'import json, subprocess; m=json.load(open("work/signed/manifest.json")); assert m["deployment_commit"] == subprocess.check_output(["git", "-C", "release", "rev-parse", "HEAD"], text=True).strip(); assert m.get("installation_archive_sha256")'
      - name: Verify daemon isolation and offline installation
        env:
          TEST_WORKSPACE: ${{ github.workspace }}/work
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,GITHUB_RUN_ID,GITHUB_EVENT_NAME,GITHUB_REPOSITORY,GITHUB_WORKSPACE,RUNNER_ENVIRONMENT,TEST_WORKSPACE "$PWD/work/venv/bin/python" driver/scripts/offline_compose_ci.py
