name: Verify published install and update wizards
on:
  workflow_dispatch:
    inputs:
      old_tag:
        description: Published signed deployment 0.1.5
        required: true
        type: string
        default: deploy-2026.10.29-signed-1
      new_tag:
        description: Published signed deployment 0.1.6
        required: true
        type: string
permissions:
  contents: read
jobs:
  wizards:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        backend: [compose, kubernetes]
    env:
      OLD_TAG: ${{ inputs.old_tag }}
      NEW_TAG: ${{ inputs.new_tag }}
    steps:
      - name: Check release tag syntax
        shell: bash
        run: |
          for value in "$OLD_TAG" "$NEW_TAG"; do
            [[ "$value" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] || exit 1
          done
          [[ "$OLD_TAG" != "$NEW_TAG" ]]
      - name: Fetch public deployment repository anonymously
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          [[ "$GITHUB_REPOSITORY" == 'prince174/uter_deploy' ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test ! -e "$GITHUB_WORKSPACE/.git"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C "$GITHUB_WORKSPACE" -c credential.helper= fetch --no-recurse-submodules --tags origin '+refs/heads/*:refs/remotes/origin/*'
          git -C "$GITHUB_WORKSPACE" checkout --detach "$GITHUB_SHA"
      - name: Download public signed releases without credentials
        shell: bash
        run: |
          for side in old new; do
            mkdir -p "work/pair/$side"
            if [ "$side" = old ]; then tag="$OLD_TAG"; else tag="$NEW_TAG"; fi
            for file in signed-bundle.tar.gz publisher-public.pem installation-inputs.tar.gz installation-inputs.tar.gz.sha256; do
              curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
                --connect-timeout 20 --max-time 180 --max-filesize 134217728 \
                -o "work/pair/$side/$file" "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$file"
            done
          done
          mkdir -p work/disallowed
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 20 --max-time 180 --max-filesize 134217728 \
            -o work/disallowed/signed-bundle.tar.gz \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/deploy-2026.10.28-signed-5/signed-bundle.tar.gz"
      - name: Prepare dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt
          curl -fsSLO https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz
          curl -fsSLO https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz.sha256sum
          sha256sum -c helm-v3.17.3-linux-amd64.tar.gz.sha256sum
          tar -xzf helm-v3.17.3-linux-amd64.tar.gz
          sudo install linux-amd64/helm /usr/local/bin/helm
      - name: Verify both signatures, input hashes, tag commits and transition
        run: |
          .venv/bin/python scripts/release_upgrade_preflight_ci.py \
            --old-tag "$OLD_TAG" --new-tag "$NEW_TAG" --old-version 0.1.5 --new-version 0.1.6
      - name: Install pinned kind
        if: matrix.backend == 'kubernetes'
        run: |
          curl -fsSL https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64 -o kind-bin
          echo 'aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  kind-bin' | sha256sum -c -
          sudo install kind-bin /usr/local/bin/kind
      - name: Exercise public wizards with isolated workloads
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          sudo --preserve-env=GITHUB_ACTIONS,GITHUB_EVENT_NAME,GITHUB_REPOSITORY,RUNNER_ENVIRONMENT,RUNNER_OS,GITHUB_WORKSPACE,BACKEND,OLD_TAG,NEW_TAG \
            "$PWD/.venv/bin/python" scripts/wizard_ci.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: wizard-${{ matrix.backend }}-evidence
          path: |
            work/release-upgrade-preflight.json
            work/wizard-evidence.json
          retention-days: 30
          if-no-files-found: warn
