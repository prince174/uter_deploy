name: Inventory GHCR versions for public disclosure audit
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Inventory all versions without exporting credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work/package-inventory
          python - <<'PY'
          import json,os,pathlib,subprocess
          owner=os.environ['GITHUB_REPOSITORY_OWNER']
          for service in ('guardrail','agent','redis'):
              endpoint=f'/users/{owner}/packages/container/uter-{service}/versions?per_page=100'
              proc=subprocess.run(['gh','api','--paginate','--slurp',endpoint],capture_output=True,text=True)
              if proc.returncode:
                  raise SystemExit(f'Could not list private package versions for {service}')
              pages=json.loads(proc.stdout)
              versions=[{'digest':v['name'],'tags':v.get('metadata',{}).get('container',{}).get('tags',[])} for page in pages for v in page]
              if not versions: raise SystemExit(f'No versions returned for {service}')
              pathlib.Path(f'work/package-inventory/{service}.json').write_text(json.dumps(versions,indent=2)+'\n')
              print(service,'versions:',len(versions))
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: package-inventory
          path: work/package-inventory/
          retention-days: 7
