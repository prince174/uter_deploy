name: Test candidate Redis ACL on protected Uter images
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful authenticated private snapshot build run
        required: true
        type: string
      patch_sha256:
        description: Exact authenticated source snapshot digest
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  maintenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      PATCH_SHA256: ${{ inputs.patch_sha256 }}
      GH_TOKEN: ${{ github.token }}
      UTER_CI_REDIS_ACL: 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Check build identity and outcome
        run: |
          python - <<'PY'
          import json,os,re,subprocess
          run_id=os.environ['BUILD_RUN_ID']; patch=os.environ['PATCH_SHA256']
          assert re.fullmatch(r'[1-9][0-9]{0,19}',run_id) and re.fullmatch(r'[0-9a-f]{64}',patch)
          repo=os.environ['GITHUB_REPOSITORY']; assert re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+',repo)
          run=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run_id}']))
          assert run['path']=='.github/workflows/snapshot-protected-images.yml' and run['conclusion']=='success'
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: protected-*
          path: work/images
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Verify snapshot provenance and load protected images
        run: |
          python - <<'PY'
          import json,os,pathlib,re
          base=json.loads(pathlib.Path('candidates/source.json').read_text())['source_commit']
          for service in ('agent','guardrail'):
              root=pathlib.Path('work/images')/('protected-'+service)/'evidence'
              state=json.loads((root/'source-state.json').read_text())
              assert state=={'kind':'uncommitted_patch','baseline_commit':base,'patch_sha256':os.environ['PATCH_SHA256']}
              assert re.fullmatch(r'sha256:[0-9a-f]{64}',(root/'image-id.txt').read_text().strip())
          PY
          for service in guardrail agent; do
            docker load -i "work/images/protected-$service/image.tar.gz" > /dev/null
            actual=$(docker image inspect "uter-$service-protected" --format '{{.Id}}')
            expected=$(cat "work/images/protected-$service/evidence/image-id.txt")
            test "$actual" = "$expected"
          done
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt > /dev/null
      - name: Exercise selected product Redis paths in disposable Compose
        run: python scripts/image_integration.py > /dev/null 2>&1 || { echo 'Candidate product ACL integration failed'; exit 1; }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: redis-acl-product-evidence
          path: |
            work/integration-evidence/redis-acl-product.txt
            work/integration-evidence/redis-acl-product-failure.txt
          retention-days: 7
          if-no-files-found: warn
