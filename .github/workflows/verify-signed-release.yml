name: Verify signed release as an anonymous installer
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published signed release tag, also select this tag as workflow ref
        required: true
        type: string
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        backend: [compose, kubernetes]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Download public release without credentials
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          case "$RELEASE_TAG" in *[!a-zA-Z0-9._-]*|'') exit 1;; esac
          test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_TAG"
          mkdir -p work/download
          for file in installation-inputs.tar.gz installation-inputs.tar.gz.sha256 signed-bundle.tar.gz signed-bundle.tar.gz.sha256 publisher-public.pem; do
            curl -fL -o "work/download/$file" "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$file"
          done
          (cd work/download && sha256sum -c installation-inputs.tar.gz.sha256 && sha256sum -c signed-bundle.tar.gz.sha256)
          echo '65be6fd9613fa7e879735fe5b453bfcb8c0e38911cd7429c9aac9c9afba676a2  work/download/publisher-public.pem' | sha256sum -c -
          python scripts/extract_release_inputs.py work/download/installation-inputs.tar.gz work/download/installation-inputs.tar.gz.sha256 work/published
      - name: Install Python tooling and pinned Helm
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt
          curl -fsSLO https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz
          curl -fsSLO https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz.sha256sum
          sha256sum -c helm-v3.17.3-linux-amd64.tar.gz.sha256sum
          tar -xzf helm-v3.17.3-linux-amd64.tar.gz
          sudo install linux-amd64/helm /usr/local/bin/helm
      - name: Verify and extract signed release
        run: |
          .venv/bin/python scripts/extract_signed_bundle.py --archive work/download/signed-bundle.tar.gz \
            --key work/download/publisher-public.pem --output work/signed
          .venv/bin/python -c 'import json,subprocess; m=json.load(open("work/signed/manifest.json")); assert m["deployment_commit"]==subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()'
      - name: Install pinned kind
        if: matrix.backend == 'kubernetes'
        run: |
          curl -fsSL https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64 -o kind-bin
          echo 'aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  kind-bin' | sha256sum -c -
          sudo install kind-bin /usr/local/bin/kind
      - name: Install and adopt using signed tooling
        env:
          PUBLIC_REGISTRY: '1'
          BACKEND: ${{ matrix.backend }}
          SIGNED_BUNDLE_PATH: ${{ github.workspace }}/work/signed
          PUBLISHER_KEY_PATH: ${{ github.workspace }}/work/download/publisher-public.pem
        run: sudo --preserve-env=GITHUB_ACTIONS,GITHUB_RUN_ID,GITHUB_ACTOR,PUBLIC_REGISTRY,BACKEND,SIGNED_BUNDLE_PATH,PUBLISHER_KEY_PATH "$PWD/.venv/bin/python" scripts/installation_ci.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: signed-installation-${{ matrix.backend }}-evidence
          path: work/installation-evidence/
          retention-days: 30
          if-no-files-found: error
