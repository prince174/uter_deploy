name: Synthetic Kubernetes Redis fence experiment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install pinned Python dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/uter-venv"
          "$RUNNER_TEMP/uter-venv/bin/pip" install -r requirements.txt
      - name: Unit tests without Kubernetes or Docker
        run: |
          "$RUNNER_TEMP/uter-venv/bin/python" -m unittest discover -s tests -p test_experimental_kube_fence_ci.py -v
          "$RUNNER_TEMP/uter-venv/bin/python" -m unittest discover -s tests -p test_kubernetes_fence_finalizer.py -v
          "$RUNNER_TEMP/uter-venv/bin/python" -m unittest discover -s tests -p test_kubernetes_redis_shutdown.py -v
      - name: Install pinned kind
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64 -o "$RUNNER_TEMP/kind"
          echo 'aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  '"$RUNNER_TEMP/kind" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/kind"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Run disposable synthetic-only cluster lifecycle
        run: |
          set -euo pipefail
          ulimit -c 0
          "$RUNNER_TEMP/uter-venv/bin/python" -m scripts.experimental_kube_fence_ci
