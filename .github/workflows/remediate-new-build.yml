name: Remediate and gate a new source build
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful protected-images run ID
        required: true
        type: string
permissions:
  contents: read
  packages: read
  actions: read
jobs:
  remediate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        service: [guardrail, agent, redis]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Validate exact source build
        id: build_identity
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          python - <<'PY'
          import json,os,re,subprocess
          run_id=os.environ['BUILD_RUN_ID']
          assert re.fullmatch(r'[0-9]+',run_id)
          run=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{run_id}']))
          assert run['path'] in ('.github/workflows/protected-images.yml', '.github/workflows/snapshot-protected-images.yml') and run['conclusion']=='success'
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('snapshot='+str(run['path'].endswith('/snapshot-protected-images.yml')).lower()+'\n')
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: steps.build_identity.outputs.snapshot == 'true'
        with:
          pattern: snapshot-provenance-*
          path: work/provenance
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: matrix.service != 'redis'
        with:
          name: protected-${{ matrix.service }}
          path: work/original
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Load exact source build and configuration
        env:
          SERVICE: ${{ matrix.service }}
          SNAPSHOT_BUILD: ${{ steps.build_identity.outputs.snapshot }}
        run: |
          mkdir -p work/evidence
          python - <<'PY'
          import json,os,pathlib,shutil,subprocess,hashlib,re
          from scripts import source_provenance
          svc=os.environ['SERVICE']; candidate=json.loads(pathlib.Path('candidates/source.json').read_text())['source_commit']
          assert re.fullmatch(r'[0-9a-f]{40}',candidate)
          baseline=json.loads(pathlib.Path('packaging/security-baseline.json').read_text())
          evidence=pathlib.Path('work/evidence')
          snapshot=os.environ['SNAPSHOT_BUILD']=='true'
          state=None
          if snapshot:
              base=pathlib.Path('work/provenance')
              states=[json.loads((base/f'snapshot-provenance-{name}'/'source-state.json').read_text()) for name in ('guardrail','agent')]
              state=source_provenance.validate(states[0],candidate)
              assert source_provenance.validate(states[1],candidate)==state
          if svc!='redis':
              original=pathlib.Path('work/original'); e=original/'evidence'
              assert (e/'source-sha.txt').read_text().strip()==candidate
              if snapshot: assert json.loads((e/'source-state.json').read_text())==state
              archive=original/'image.tar.gz'
              with archive.open('rb') as f: actual=hashlib.file_digest(f,'sha256').hexdigest()
              assert actual==(e/'archive.sha256').read_text().split()[0]
              subprocess.run(['docker','load','-i',str(archive)],check=True)
              image=f'uter-{svc}-protected'
              image_id=subprocess.check_output(['docker','image','inspect',image,'--format','{{.Id}}'],text=True).strip()
              assert image_id==(e/'image-id.txt').read_text().strip()
              for name in ('policies','profiles'): shutil.copytree(e/name,evidence/name)
          else:
              image=baseline['redis_target']
              subprocess.run(['docker','pull','--platform','linux/amd64',image],check=True)
          (evidence/'source-sha.txt').write_text(candidate+'\n')
          if snapshot: (evidence/'source-state.json').write_text(json.dumps(state,sort_keys=True)+'\n')
          (evidence/'parent-image.txt').write_text(image+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('BASELINE_IMAGE='+image+'\nREDIS_TARGET='+baseline['redis_target']+'\n')
          PY
      - name: Baseline vulnerability and secret report with current database
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          version: v0.74.0
          scan-type: image
          image-ref: ${{ env.BASELINE_IMAGE }}
          scanners: vuln,secret
          format: json
          output: work/evidence/before-findings.json
          exit-code: '0'
          timeout: 10m
      - name: Build minimal dependency-remediated runtime
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          if [ "$SERVICE" = redis ]; then
            docker pull --platform linux/amd64 "$REDIS_TARGET"
            docker tag "$REDIS_TARGET" uter-redis-protected
          else
            docker build --provenance=false --build-arg "PROTECTED_IMAGE=$BASELINE_IMAGE" --build-arg "SERVICE=$SERVICE" -f packaging/Dockerfile.security-current -t "uter-$SERVICE-protected" packaging
            docker run --rm --network none --entrypoint python "uter-$SERVICE-protected" -c 'import json,pathlib,ssl,uuid; p=pathlib.Path("/usr/share/uter/runtime-inventory.json"); d=json.loads(p.read_text()); assert d["os_packages"] and d["library_owners"]; assert pathlib.Path("/var/lib/dpkg/status").stat().st_size; assert not pathlib.Path("/bin/sh").exists(); assert ssl.get_default_verify_paths().cafile; uuid.uuid4(); print(p.read_text())' > work/evidence/runtime-inventory.json
          fi
          docker image inspect "uter-$SERVICE-protected" --format '{{.Id}}' > work/evidence/image-id.txt
      - name: Compiled modules and offline model inference
        if: matrix.service != 'redis'
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:size=256m --memory=4g --cpus=2 \
            -e JWT_SECRET=ci-only-runtime-secret -e AGENT_INTERNAL_SHARED_SECRET=ci-only-shared-secret \
            -e GUARDRAIL_SERVICE_PASSWORD=ci-only-service-password -e HF_HUB_OFFLINE=1 -e TRANSFORMERS_OFFLINE=1 \
            -e AUDIT_LOG_ENABLED=false -e JUDGE_ENABLED=false -e SECURITY_POLICY_PATH=/app/policies/default.toml \
            -v "$PWD/work/evidence/policies:/app/policies:ro" -v "$PWD/work/evidence/profiles:/app/profiles:ro" \
            -v "$PWD/scripts/check_compiled_runtime.py:/checks/check.py:ro" \
            --entrypoint python "uter-$SERVICE-protected" /checks/check.py "$SERVICE" > work/evidence/runtime-check.json 2>/dev/null || { echo 'Protected runtime check failed'; exit 1; }
      - name: Verify actually loaded SQLite library
        if: matrix.service != 'redis'
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          docker run --rm --network none -i --entrypoint python "uter-$SERVICE-protected" - > work/evidence/sqlite-measurement.json <<'PY'
          import hashlib, json, sqlite3
          assert sqlite3.sqlite_version == '3.54.1'
          db=sqlite3.connect(':memory:')
          db.execute('create virtual table docs using fts5(content)')
          db.execute('insert into docs values (?)',('security update',))
          assert db.execute('select count(*) from docs where docs match ?',('security',)).fetchone()[0]==1
          paths={line.split()[-1] for line in open('/proc/self/maps') if 'libsqlite3.so' in line}
          assert len(paths)==1
          digest=hashlib.sha256(open(paths.pop(),'rb').read()).hexdigest()
          assert digest=='225ceb839db2c1dd484cfcaa5ef9fbdd429eb1d5f1e0c39fbd50150bca5fc7bc'
          print(json.dumps({'sqlite_version':sqlite3.sqlite_version,'library_sha256':digest,'fts5':'pass'}))
          PY
      - name: Measure actually loaded OpenSSL and package provenance
        if: matrix.service != 'redis'
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          docker run --rm --network none -i --entrypoint python "uter-$SERVICE-protected" - > work/evidence/openssl-measurement.json <<'PY'
          import hashlib,json,ssl
          from pathlib import Path
          assert ssl.OPENSSL_VERSION.startswith('OpenSSL 3.0.22 ')
          lines=Path('/proc/self/maps').read_text().splitlines()
          libs={name:{line.split()[-1] for line in lines if name in line} for name in ('libssl.so.3','libcrypto.so.3')}
          assert all(len(paths)==1 and next(iter(paths)).startswith('/usr/local/lib/') for paths in libs.values())
          hashes={name:hashlib.sha256(Path(paths.pop()).read_bytes()).hexdigest() for name,paths in libs.items()}
          assert hashes==json.loads(Path('/usr/local/share/uter-openssl-package/library-hashes.json').read_text())
          control=Path('/usr/local/share/uter-openssl-package/control.txt').read_text()
          assert 'Package: libssl3\n' in control and 'Version: 3.0.22-1~deb12u2\n' in control
          print(json.dumps({'version':ssl.OPENSSL_VERSION,'libraries':hashes,'package':'libssl3','package_version':'3.0.22-1~deb12u2','distribution':'debian-12-bookworm','package_sha256':'cb4784740daa9b3b0eaea2b444bbefa686794afbbf3d678d238c1fd9875f2efd'}))
          PY
      - name: Exercise real offline TLS and certificate rejection
        if: matrix.service != 'redis'
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          mkdir -p work/tls-fixture
          openssl req -x509 -newkey rsa:2048 -nodes -keyout work/tls-fixture/key.pem -out work/tls-fixture/cert.pem -days 1 -subj /CN=localhost -addext subjectAltName=DNS:localhost >/dev/null 2>&1
          chmod 644 work/tls-fixture/key.pem work/tls-fixture/cert.pem
          docker run --rm --network none --read-only --tmpfs /tmp:size=16m \
            -v "$PWD/work/tls-fixture:/fixture:ro" -v "$PWD/scripts/check_openssl_tls.py:/checks/tls.py:ro" \
            --entrypoint python "uter-$SERVICE-protected" /checks/tls.py /fixture/cert.pem /fixture/key.pem > work/evidence/openssl-tls-check.json
      - name: Agent dependency compatibility and offline embeddings
        if: matrix.service == 'agent'
        run: |
          mkdir -p work/embedding-cache
          sudo chown 10001:10001 work/embedding-cache
          docker run --rm --memory=2g --cpus=2 -v "$PWD/work/embedding-cache:/tmp/fastembed" \
            -v "$PWD/scripts/check_agent_dependencies_current.py:/checks/check.py:ro" --entrypoint python uter-agent-protected /checks/check.py download > work/evidence/dependency-download-check.json 2>/dev/null || { echo 'Agent dependency download check failed'; exit 1; }
          docker run --rm --network none --memory=2g --cpus=2 -e HF_HUB_OFFLINE=1 \
            -v "$PWD/work/embedding-cache:/tmp/fastembed" -v "$PWD/scripts/check_agent_dependencies_current.py:/checks/check.py:ro" \
            --entrypoint python uter-agent-protected /checks/check.py offline > work/evidence/dependency-offline-check.json 2>/dev/null || { echo 'Agent offline dependency check failed'; exit 1; }
      - name: Full candidate vulnerability and secret report
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          version: v0.74.0
          scan-type: image
          image-ref: uter-${{ matrix.service }}-protected
          scanners: vuln,secret
          format: json
          output: work/evidence/findings.json
          exit-code: '0'
          timeout: 10m
      - name: Candidate SBOM
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          version: v0.74.0
          scan-type: image
          image-ref: uter-${{ matrix.service }}-protected
          format: cyclonedx
          output: work/evidence/sbom.cdx.json
          exit-code: '0'
          timeout: 10m
      - name: Prepare independent vendor package inventory
        if: matrix.service != 'redis'
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          container=$(docker create "uter-$SERVICE-protected")
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker cp "$container:/usr/local/share/uter-openssl-package/control.txt" work/evidence/openssl-control.txt
          python scripts/vendor_openssl_gate.py prepare work/evidence/openssl-measurement.json work/evidence/openssl-control.txt work/openssl-inventory
      - name: Scan vendor OpenSSL package using its actual Debian release
        if: matrix.service != 'redis'
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: work/openssl-inventory/actual
          scanners: vuln
          list-all-pkgs: true
          format: json
          output: work/evidence/vendor-openssl-report.json
          exit-code: '0'
          timeout: 10m
      - name: Verify vendor scanner detects a vulnerable control
        if: matrix.service != 'redis'
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: work/openssl-inventory/negative
          scanners: vuln
          list-all-pkgs: true
          format: json
          output: work/evidence/vendor-openssl-control-report.json
          exit-code: '0'
          timeout: 10m
      - name: Enforce vendor package security check
        if: matrix.service != 'redis'
        run: python scripts/vendor_openssl_gate.py verify work/evidence/vendor-openssl-report.json work/evidence/vendor-openssl-control-report.json work/evidence/vendor-openssl-summary.json
      - name: Export source-scanned candidate for isolated verification
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.security_gate import summary
          with open('work/evidence/findings.json') as stream: raw=json.load(stream)
          report=summary(raw)
          if report['secrets'] != 0: raise SystemExit('Refusing export with secret findings')
          Path('work/evidence/trivy-vuln-report.json').write_text(json.dumps(raw,indent=2)+'\n')
          PY
          docker save "uter-$SERVICE-protected" -o work/image.tar
          python scripts/scan_image_archive.py work/image.tar --report work/evidence/source-scan.json > work/evidence/source-scan.txt
          gzip -1 work/image.tar
          sha256sum work/image.tar.gz > work/evidence/archive.sha256
      - name: Require zero Critical High and secret findings
        id: strict_gate
        continue-on-error: true
        run: python scripts/security_gate.py work/evidence/findings.json work/evidence/security-summary.json
      - name: Apply authorized image-bound SQLite assessment
        if: steps.strict_gate.outcome == 'failure' && matrix.service != 'redis'
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          test "$(docker image inspect "uter-$SERVICE-protected" --format '{{.Id}}')" = "$(cat work/evidence/image-id.txt)"
          python scripts/sqlite_vex_gate.py work/evidence/trivy-vuln-report.json work/evidence/image-id.txt work/evidence/sqlite-measurement.json work/evidence/sqlite-vex-summary.json
      - name: Enforce effective gate
        env:
          SERVICE: ${{ matrix.service }}
          STRICT_OUTCOME: ${{ steps.strict_gate.outcome }}
        run: |
          if [ "$STRICT_OUTCOME" = success ]; then exit 0; fi
          test "$SERVICE" != redis && test "$STRICT_OUTCOME" = failure && test -s work/evidence/sqlite-vex-summary.json
      - name: Record sanitized vulnerability diagnostics
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('work/evidence/findings.json')
          if path.is_file():
              data=json.loads(path.read_text())
              findings=[]; secrets=0
              for result in data.get('Results', []):
                  secrets += len(result.get('Secrets') or [])
                  for item in result.get('Vulnerabilities') or []:
                      if item.get('Severity') in ('HIGH','CRITICAL'):
                          findings.append({**{key:item.get(key) for key in ('VulnerabilityID','Severity','PkgName','InstalledVersion','FixedVersion')},'purl':(item.get('PkgIdentifier') or {}).get('PURL')})
              Path('work/evidence/vulnerability-summary.json').write_text(json.dumps({'findings':findings,'secret_count':secrets},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: protected-${{ matrix.service }}
          path: |
            work/image.tar.gz
            work/evidence/image-id.txt
            work/evidence/source-sha.txt
            work/evidence/source-state.json
            work/evidence/archive.sha256
            work/evidence/parent-image.txt
            work/evidence/security-summary.json
            work/evidence/vulnerability-summary.json
            work/evidence/sqlite-measurement.json
            work/evidence/openssl-measurement.json
            work/evidence/openssl-control.txt
            work/evidence/openssl-tls-check.json
            work/evidence/sqlite-vex-summary.json
            work/evidence/trivy-vuln-report.json
            work/evidence/vendor-openssl-summary.json
            work/evidence/vendor-openssl-report.json
            work/evidence/vendor-openssl-control-report.json
            work/evidence/policies/default.toml
            work/evidence/profiles/model_profiles.toml
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
