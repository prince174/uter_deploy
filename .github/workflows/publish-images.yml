name: Publish private images and verify installation
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful harden-image-artifacts or remediate-images run ID
        required: true
        type: string
permissions:
  contents: read
  actions: read
  packages: read
concurrency:
  group: private-image-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: protected-*
          path: work/images
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Authenticate registry without command-line credentials
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish verified archives and verify private access
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: python scripts/publish_images.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: installation-inputs
          path: work/published/
          retention-days: 30
          if-no-files-found: error
  install:
    needs: publish
    uses: ./.github/workflows/verify-installation.yml
    with:
      artifact_run_id: ${{ github.run_id }}
      registry: ghcr.io
