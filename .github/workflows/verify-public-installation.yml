name: Verify anonymous public installation
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        backend: [compose, kubernetes]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Download public release without credentials
        run: |
          mkdir -p work/download work/published
          for file in installation-inputs.tar.gz installation-inputs.tar.gz.sha256; do
            curl -fL -o "work/download/$file" "https://github.com/prince174/uter_deploy/releases/download/deploy-2026.10.28-2/$file"
          done
          (cd work/download && sha256sum -c installation-inputs.tar.gz.sha256)
          python scripts/extract_release_inputs.py work/download/installation-inputs.tar.gz work/download/installation-inputs.tar.gz.sha256 work/validated
          tar -xzf work/download/installation-inputs.tar.gz -C work/published
          diff -r work/validated work/published
      - name: Install Python tooling and pinned Helm
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt
          curl -fsSLO https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz
          curl -fsSLO https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz.sha256sum
          sha256sum -c helm-v3.17.3-linux-amd64.tar.gz.sha256sum
          tar -xzf helm-v3.17.3-linux-amd64.tar.gz
          sudo install linux-amd64/helm /usr/local/bin/helm
      - name: Install pinned kind
        if: matrix.backend == 'kubernetes'
        run: |
          curl -fsSL https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64 -o kind-bin
          echo 'aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  kind-bin' | sha256sum -c -
          sudo install kind-bin /usr/local/bin/kind
      - name: Install using README wizard and exercise real services
        env:
          PUBLIC_REGISTRY: '1'
          BACKEND: ${{ matrix.backend }}
        run: sudo --preserve-env=GITHUB_ACTIONS,GITHUB_RUN_ID,GITHUB_ACTOR,PUBLIC_REGISTRY,BACKEND "$PWD/.venv/bin/python" scripts/installation_ci.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: public-installation-${{ matrix.backend }}-evidence
          path: work/installation-evidence/
          retention-days: 30
          if-no-files-found: error

