name: Synthetic Compose Redis fence lifecycle
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Unit tests without Docker
        run: python3 -m unittest discover -s tests -p test_experimental_compose_fence_ci.py -v
      - name: Synthetic network, AOF and daemon restart lifecycle
        run: |
          set -euo pipefail
          ulimit -c 0
          python3 -m scripts.experimental_compose_fence_ci
