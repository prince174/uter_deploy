name: Experimental Compose inspect template
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UTER_CI_TEMPLATE: 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install dependencies
        run: python -m pip install -r requirements.txt > /dev/null
      - name: Verify read-only selection and fail-closed outcomes
        run: python -m unittest tests.test_compose_maintenance_live -q
      - name: Check Docker template against a synthetic container
        run: python scripts/compose_maintenance_template_ci.py
