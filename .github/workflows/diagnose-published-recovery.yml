name: Diagnose published signed recovery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        backend: [compose, kubernetes]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Download public release assets without credentials
        run: |
          git fetch --no-tags origin refs/tags/deploy-2026.10.28-signed-5:refs/tags/deploy-2026.10.28-signed-5
          for side in old new; do
            mkdir -p "work/pair/$side"
            if [ "$side" = old ]; then tag=deploy-2026.10.28-signed-3; else tag=deploy-2026.10.28-signed-5; fi
            for file in installation-inputs.tar.gz installation-inputs.tar.gz.sha256 signed-bundle.tar.gz signed-bundle.tar.gz.sha256 publisher-public.pem; do
              curl -fsSL -o "work/pair/$side/$file" "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$file"
            done
            (cd "work/pair/$side" && sha256sum -c installation-inputs.tar.gz.sha256 && sha256sum -c signed-bundle.tar.gz.sha256)
            echo "65be6fd9613fa7e879735fe5b453bfcb8c0e38911cd7429c9aac9c9afba676a2  work/pair/$side/publisher-public.pem" | sha256sum -c -
          done
          cmp work/pair/old/publisher-public.pem work/pair/new/publisher-public.pem
          # Baseline predates signed installation-inputs; pin the previously published bytes.
          echo 'baab1a16fc48a24692ce09489b4bc8284c1d85f90b3dd9e5655f08a260f4c657  work/pair/old/installation-inputs.tar.gz' | sha256sum -c -
      - name: Install isolated tooling
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt
          curl -fsSLO https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz
          curl -fsSLO https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz.sha256sum
          sha256sum -c helm-v3.17.3-linux-amd64.tar.gz.sha256sum
          tar -xzf helm-v3.17.3-linux-amd64.tar.gz
          sudo install linux-amd64/helm /usr/local/bin/helm
      - name: Verify signed bundles, allowed transition and input archives
        run: |
          for side in old new; do
            .venv/bin/python scripts/extract_signed_bundle.py --archive "work/pair/$side/signed-bundle.tar.gz" --key "work/pair/$side/publisher-public.pem" --output "work/pair/$side/bundle"
          done
          .venv/bin/python scripts/verify_release_pair.py --old work/pair/old/bundle --new work/pair/new/bundle --key work/pair/old/publisher-public.pem --fingerprint 65be6fd9613fa7e879735fe5b453bfcb8c0e38911cd7429c9aac9c9afba676a2 --old-version 0.1.2 --new-version 0.1.4
          .venv/bin/python -c 'import json,subprocess; m=json.load(open("work/pair/new/bundle/manifest.json")); assert m["deployment_commit"]==subprocess.check_output(["git","rev-parse","refs/tags/deploy-2026.10.28-signed-5^{commit}"],text=True).strip()'
          mkdir -p work/input
          .venv/bin/python scripts/extract_release_inputs.py work/pair/old/installation-inputs.tar.gz work/pair/old/installation-inputs.tar.gz.sha256 work/input/published-old --legacy-unverified
          .venv/bin/python scripts/extract_release_inputs.py work/pair/new/installation-inputs.tar.gz work/pair/new/installation-inputs.tar.gz.sha256 work/input/published-new --bundle work/pair/new/bundle --key work/pair/new/publisher-public.pem
      - name: Install pinned kind
        if: matrix.backend == 'kubernetes'
        run: |
          curl -fsSL https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64 -o kind-bin
          echo 'aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  kind-bin' | sha256sum -c -
          sudo install kind-bin /usr/local/bin/kind
      - name: Install old signed release, upgrade and restore using published tools
        env:
          BACKEND: ${{ matrix.backend }}
          UTER_CI_RELEASE_MODE: published
          UTER_CI_NEW_VERSION: '0.1.4'
          UTER_CI_NEW_TAG: deploy-2026.10.28-signed-5
          OLD_SIGNED_BUNDLE_PATH: ${{ github.workspace }}/work/pair/old/bundle
          NEW_SIGNED_BUNDLE_PATH: ${{ github.workspace }}/work/pair/new/bundle
          PUBLISHER_KEY_PATH: ${{ github.workspace }}/work/pair/old/publisher-public.pem
        run: sudo --preserve-env=GITHUB_ACTIONS,BACKEND,UTER_CI_RELEASE_MODE,UTER_CI_NEW_VERSION,UTER_CI_NEW_TAG,OLD_SIGNED_BUNDLE_PATH,NEW_SIGNED_BUNDLE_PATH,PUBLISHER_KEY_PATH "$PWD/.venv/bin/python" scripts/adopt_backup_ci.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: signed-recovery-diagnostic-${{ matrix.backend }}-evidence
          path: work/adopt-backup-evidence/
          retention-days: 30
          if-no-files-found: warn
