name: Experimental staged Redis writer admission
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UTER_CI_STAGED_ACL: 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install dependencies
        run: python -m pip install -r requirements.txt > /dev/null
      - name: Check staged fail-closed cases
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS,UTER_CI_STAGED_ACL "$(command -v python)" -m unittest tests.test_redis_acl_staged tests.test_redis_acl_staged_profile tests.test_redis_acl_durable -q
      - name: Test staged admission and Redis restart on isolated fixture
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS,UTER_CI_STAGED_ACL "$(command -v python)" scripts/redis_acl_staged_ci.py
