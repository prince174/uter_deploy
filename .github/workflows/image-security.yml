name: Audit protected image artifacts
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Audit request marker
        required: true
        type: string
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: agent
            image: ghcr.io/prince174/uter-agent@sha256:e24f8c317454e63909f6ad63d336da950087a3b667941c34dc40ae96f1b0156d
            image_id: sha256:9d1a434c98583ae9fd3ea7f5751890203aab893d8907fbb326a25fb1a44c163f
          - service: guardrail
            image: ghcr.io/prince174/uter-guardrail@sha256:424eea6581f4751a6cdcb3df11c5083216868e4a8911353576e99ff3093d60a8
            image_id: sha256:a4cb616229c6d223caa575505cec807f27af8d3ec892980f9e5bdcfca6885f36
          - service: redis
            image: ghcr.io/prince174/uter-redis@sha256:b4a3dd93f2f7e276b98131e947d2c30e4b237d964c87a948cf808f160eef2fcc
            image_id: sha256:98c6ca8f397f86e469be752c3e7ed5eb8b17f2479840cb69a2e413037038e9f4
    steps:
      - name: Pull exact published digest without credentials
        env:
          IMAGE: ${{ matrix.image }}
          IMAGE_ID: ${{ matrix.image_id }}
        run: |
          docker --config "$(mktemp -d)" pull "$IMAGE"
          test "$(docker image inspect "$IMAGE" --format '{{.Id}}')" = "$IMAGE_ID"
          mkdir -p work/evidence
      - name: Trivy vulnerability scan without VEX filtering
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          version: v0.76.2
          scan-type: image
          image-ref: ${{ matrix.image }}
          scanners: vuln
          format: json
          output: work/evidence/trivy.json
          exit-code: '0'
          timeout: 15m
      - name: Inspect filesystem and check Java runtime
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          mkdir -p work/rootfs
          container=$(docker create "$IMAGE")
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker export "$container" | tar -xf - -C work/rootfs
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('work/rootfs'); found=[]; app=[]
          for base, dirs, files in os.walk(root, followlinks=False):
              for name in files:
                  p=Path(base)/name; lower=name.lower(); rel=str(p.relative_to(root))
                  if lower in ('java','javac','libjvm.so','jvm.dll','java.exe') or lower.startswith(('libjvm.so.',)):
                      found.append(rel)
                  if rel.startswith('app/') and p.suffix.lower() in ('.py','.js','.ts','.java','.sh','.go','.rb','.php'):
                      app.append(rel)
          Path('work/evidence/inventory.json').write_text(json.dumps({'java_runtime_candidates':found,'app_source_files':app,'scope':'final image filesystem; paths only; nested archives and downloaded runtime not inspected'},indent=2)+'\n')
          PY
      - name: Semgrep scan on available application text
        run: |
          python3 -m pip install --disable-pip-version-check 'semgrep==1.185.0' > /tmp/semgrep-install.log 2>&1
          if [ -d work/rootfs/app ]; then
            semgrep scan --config p/security-audit --json --metrics=off --disable-version-check --no-git-ignore work/rootfs/app > /tmp/semgrep-result.json 2>/tmp/semgrep-error.log || echo failed > /tmp/semgrep-exit
          else
            printf '{"results":[],"errors":[],"paths":{"scanned":[]}}' > /tmp/semgrep-result.json
            echo no_app_dir > /tmp/semgrep-exit
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/semgrep-result.json')
          try:
              data=json.loads(p.read_text()); results=data.get('results',[]); errors=data.get('errors',[])
              result={'findings':[{'rule':r.get('check_id'),'path':r.get('path'),'line':r.get('start',{}).get('line'),'severity':r.get('extra',{}).get('severity')} for r in results], 'errors':[{'type':e.get('type'),'code':e.get('code'),'message':str(e.get('message',''))[:500]} for e in errors], 'scanned_files':len(data.get('paths',{}).get('scanned',[])), 'exit_state':Path('/tmp/semgrep-exit').read_text().strip() if Path('/tmp/semgrep-exit').exists() else 'success', 'scope':'available source text under /app only; compiled code excluded'}
          except Exception: result={'exit_state':'invalid_result','scope':'available source text under /app only'}
          Path('work/evidence/semgrep-summary.json').write_text(json.dumps(result,indent=2)+'\n')
          if result['exit_state'] not in ('success','no_app_dir'): raise SystemExit('Semgrep did not complete')
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: image-audit-${{ matrix.service }}
          path: work/evidence/
          retention-days: 14
          if-no-files-found: warn
