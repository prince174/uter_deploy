name: Test upstream and propose deployment candidate
on:
  workflow_dispatch:
  repository_dispatch:
    types: [uter-source-updated]
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: source-sync
  cancel-in-progress: false
jobs:
  deployment-test:
    if: github.event_name != 'schedule' || vars.SOURCE_SYNC_ENABLED == 'true'
    uses: ./.github/workflows/ci.yml
  source-test:
    if: github.event_name != 'schedule' || vars.SOURCE_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      changed: ${{ steps.source.outputs.changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Require read-only upstream credential
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
        run: |
          test -n "$SOURCE_READ_TOKEN" || { echo 'Configure SOURCE_READ_TOKEN: contents read on prince174/uter only'; exit 1; }
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: prince174/uter
          ref: ${{ vars.SOURCE_REF || 'master' }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: work/upstream
          persist-credentials: false
      - id: source
        name: Resolve exact source and detect changes
        run: |
          sha=$(git -C work/upstream rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          old=$(python -c "import json,pathlib; p=pathlib.Path('candidates/source.json'); print(json.loads(p.read_text())['source_commit'] if p.exists() else '')")
          if [ "$sha" = "$old" ]; then echo 'changed=false' >> "$GITHUB_OUTPUT"; else echo 'changed=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        if: steps.source.outputs.changed == 'true'
        with:
          python-version: '3.12'
      - name: Install upstream test dependencies
        if: steps.source.outputs.changed == 'true'
        working-directory: work/upstream
        run: python -m pip install -r guardrail/requirements.txt -r agent/requirements.txt -r requirements-test.txt
      - name: Product unit and API tests in isolated checkout
        if: steps.source.outputs.changed == 'true'
        working-directory: work/upstream
        run: python -m pytest tests/unit tests/api -q
      - name: Deployment contract tests
        if: steps.source.outputs.changed == 'true'
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
  propose:
    needs: [source-test, deployment-test]
    if: needs.source-test.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Create candidate PR (never publish images or deploy customers)
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.source-test.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          branch="automation/source-$SOURCE_SHA"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then exit 0; fi
          git switch -c "$branch"
          python scripts/source_candidate.py --sha "$SOURCE_SHA" --run-url "$RUN_URL"
          git config user.name 'uter-deploy-bot'
          git config user.email 'uter-deploy-bot@users.noreply.github.com'
          git add candidates/source.json
          git commit -m "Record tested Uter source $SOURCE_SHA"
          git push origin "$branch"
          gh pr create --title "Uter deployment candidate: $SOURCE_SHA" --body-file docs/candidate-pr.md --head "$branch"
