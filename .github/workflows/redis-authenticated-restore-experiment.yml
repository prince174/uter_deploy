name: Experimental Redis authenticated restore on disposable runner
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt > /dev/null
      - name: Check bounded preparation and fail-closed cases
        run: python -m unittest tests.test_redis_recovery_experiment tests.test_redis_digest_resp tests.test_recovery_evidence_experiment -q
      - name: Restore fixture backup and bind evidence (mocked audit oracle)
        run: python scripts/redis_recovery_experiment_ci.py
