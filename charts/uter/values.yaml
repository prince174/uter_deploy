productVersion: unconfigured
images:
  guardrail: ''
  agent: ''
  redis: ''
imagePullSecrets: []
# Existing runtime resources, never packaged with a release.
guardrailSecret: ''
agentSecret: ''
redisSecret: ''
policyConfigMap: ''
profileConfigMap: ''
modelsClaim: ''
storageClass: ''
auditSize: 10Gi
redisSize: 2Gi
guardrailEnv:
  UPSTREAM_MODE: litellm_openai
  UPSTREAM_URL: https://llm.runtime.example
  UPSTREAM_OPENAI_MODEL: runtime-model
agentEnv: {}
resources:
  guardrail:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: '4', memory: 3Gi}
  agent:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {cpu: '2', memory: 1536Mi}
  redis:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: '1', memory: 512Mi}
# NetworkPolicy requires a supporting CNI. Permit ingress only from designated namespace.
ingressNamespace: ingress-nginx

# Use only with protected images that embed the required Hugging Face model.
useEmbeddedModels: false
