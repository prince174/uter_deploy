{{- range $name := list "guardrail" "agent" "redis" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/name: {{ $name }}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/name: {{ if eq $name "guardrail" }}agent{{ else }}guardrail{{ end }}}
        {{- if eq $name "guardrail" }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.ingressNamespace }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ if eq $name "redis" }}6379{{ else if eq $name "guardrail" }}8000{{ else }}8001{{ end }}
{{- end }}
